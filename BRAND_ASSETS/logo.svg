<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450">
  <defs>
    <!-- Text paths for arced labels -->
    <path id="arcTop" d="M 42,230 A 240,210 0 0,1 518,230"/>
    <path id="arcBot" d="M 55,265 A 230,200 0 0,0 505,265"/>
    <!-- Gradient for shimmer (optional) -->
  </defs>

  <!-- ── Outer oval borders ── -->
  <ellipse cx="280" cy="225" rx="272" ry="218" fill="none" stroke="#0A0A0A" stroke-width="3.5"/>
  <ellipse cx="280" cy="225" rx="261" ry="207" fill="none" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="5,4"/>
  <ellipse cx="280" cy="225" rx="250" ry="197" fill="none" stroke="#0A0A0A" stroke-width="2"/>

  <!-- ── PREMIUM QUALITY arc ── -->
  <text font-family="'Palatino Linotype', 'Palatino', 'Book Antiqua', Georgia, serif"
        font-size="19" font-weight="700" letter-spacing="7" fill="#0A0A0A">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PREMIUM  QUALITY</textPath>
  </text>

  <!-- ── TEXTILE COMPANY arc ── -->
  <text font-family="'Palatino Linotype', 'Palatino', 'Book Antiqua', Georgia, serif"
        font-size="19" font-weight="700" letter-spacing="7" fill="#0A0A0A">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">TEXTILE  COMPANY</textPath>
  </text>

  <!-- ── NTC medallion (top centre) ── -->
  <ellipse cx="280" cy="120" rx="36" ry="26" fill="white" stroke="#0A0A0A" stroke-width="2"/>
  <ellipse cx="280" cy="120" rx="29" ry="19" fill="none" stroke="#0A0A0A" stroke-width="0.8"/>
  <text x="280" y="127" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="17" font-weight="700" letter-spacing="2" fill="#0A0A0A">NTC</text>

  <!-- ── Horizontal divider lines ── -->
  <!-- Upper band lines -->
  <line x1="52" y1="160" x2="508" y2="160" stroke="#0A0A0A" stroke-width="1.8"/>
  <line x1="46" y1="167" x2="514" y2="167" stroke="#0A0A0A" stroke-width="0.6" stroke-dasharray="4,3"/>
  <!-- Lower band lines -->
  <line x1="46" y1="296" x2="514" y2="296" stroke="#0A0A0A" stroke-width="0.6" stroke-dasharray="4,3"/>
  <line x1="52" y1="303" x2="508" y2="303" stroke="#0A0A0A" stroke-width="1.8"/>

  <!-- ── NAPOLEON name box ── -->
  <rect x="60" y="208" width="440" height="70" fill="white" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="280" y="263" text-anchor="middle"
        font-family="'Palatino Linotype', 'Palatino', 'Book Antiqua', Georgia, serif"
        font-size="64" font-weight="900" letter-spacing="4" fill="#0A0A0A">NAPOLEON</text>

  <!-- ── UNIQUE label (left) ── -->
  <text x="148" y="192" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="13" letter-spacing="5" font-weight="600" fill="#0A0A0A">&#x276F;UNIQUE&#x276E;</text>

  <!-- ── TREND label (right) ── -->
  <text x="412" y="192" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="13" letter-spacing="5" font-weight="600" fill="#0A0A0A">&#x276F;TREND&#x276E;</text>

  <!-- ── CLASSIC label (left) ── -->
  <text x="148" y="322" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="12" letter-spacing="5" font-weight="600" fill="#0A0A0A">&#x276F;CLASSIC&#x276E;</text>

  <!-- ── EDITION label (right) ── -->
  <text x="412" y="322" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="12" letter-spacing="5" font-weight="600" fill="#0A0A0A">&#x276F;EDITION&#x276E;</text>

  <!-- ══════════════════════════════════════════
       ORNAMENTAL SCROLL ELEMENTS
       All done with SVG paths — no Unicode chars
  ══════════════════════════════════════════ -->

  <!-- Left upper scroll cluster -->
  <g transform="translate(148, 140)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <!-- Main C-scroll left -->
    <path d="M 0,0 C -18,-8 -32,8 -22,20 C -12,30 2,24 0,14"/>
    <path d="M 0,14 C 2,6 -8,2 -14,8 C -18,12 -12,18 -6,14"/>
    <!-- Leaf -->
    <path d="M 0,0 C 4,-6 12,-4 10,2 C 8,8 0,6 0,0 Z" fill="#0A0A0A" fill-opacity="0.7"/>
    <!-- Tendril up -->
    <path d="M 0,0 C 4,-12 14,-18 18,-12"/>
    <path d="M 18,-12 C 22,-8 18,-2 14,-4 C 10,-6 14,-12 18,-12 Z" fill="#0A0A0A" fill-opacity="0.6"/>
    <!-- Tendril right -->
    <path d="M 0,14 C 8,18 18,14 20,8"/>
    <path d="M 20,8 C 22,2 16,0 14,4 C 12,8 16,10 20,8 Z" fill="#0A0A0A" fill-opacity="0.6"/>
  </g>

  <!-- Right upper scroll cluster (mirror) -->
  <g transform="translate(412, 140) scale(-1,1)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <path d="M 0,0 C -18,-8 -32,8 -22,20 C -12,30 2,24 0,14"/>
    <path d="M 0,14 C 2,6 -8,2 -14,8 C -18,12 -12,18 -6,14"/>
    <path d="M 0,0 C 4,-6 12,-4 10,2 C 8,8 0,6 0,0 Z" fill="#0A0A0A" fill-opacity="0.7"/>
    <path d="M 0,0 C 4,-12 14,-18 18,-12"/>
    <path d="M 18,-12 C 22,-8 18,-2 14,-4 C 10,-6 14,-12 18,-12 Z" fill="#0A0A0A" fill-opacity="0.6"/>
    <path d="M 0,14 C 8,18 18,14 20,8"/>
    <path d="M 20,8 C 22,2 16,0 14,4 C 12,8 16,10 20,8 Z" fill="#0A0A0A" fill-opacity="0.6"/>
  </g>

  <!-- Centre top flourish (below NTC, above lines) -->
  <g transform="translate(280, 148)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <path d="M -20,0 C -10,-6 10,-6 20,0"/>
    <line x1="-16" y1="-2" x2="-16" y2="6"/>
    <line x1="0" y1="-4" x2="0" y2="8"/>
    <line x1="16" y1="-2" x2="16" y2="6"/>
    <circle cx="-16" cy="8" r="2" fill="#0A0A0A"/>
    <circle cx="0"  cy="10" r="2.5" fill="#0A0A0A"/>
    <circle cx="16" cy="8" r="2" fill="#0A0A0A"/>
  </g>

  <!-- Left lower scroll cluster -->
  <g transform="translate(148, 316)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <path d="M 0,0 C -16,6 -28,-8 -18,-18 C -10,-26 2,-20 0,-12"/>
    <path d="M 0,-12 C 2,-5 -8,-2 -14,-8 C -18,-12 -12,-18 -6,-14"/>
    <path d="M 0,0 C 4,6 12,4 10,-2 C 8,-8 0,-6 0,0 Z" fill="#0A0A0A" fill-opacity="0.7"/>
    <path d="M 0,-12 C 8,-16 18,-12 20,-6"/>
    <path d="M 20,-6 C 22,0 16,2 14,-2 C 12,-6 16,-8 20,-6 Z" fill="#0A0A0A" fill-opacity="0.6"/>
  </g>

  <!-- Right lower scroll cluster (mirror) -->
  <g transform="translate(412, 316) scale(-1,1)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <path d="M 0,0 C -16,6 -28,-8 -18,-18 C -10,-26 2,-20 0,-12"/>
    <path d="M 0,-12 C 2,-5 -8,-2 -14,-8 C -18,-12 -12,-18 -6,-14"/>
    <path d="M 0,0 C 4,6 12,4 10,-2 C 8,-8 0,-6 0,0 Z" fill="#0A0A0A" fill-opacity="0.7"/>
    <path d="M 0,-12 C 8,-16 18,-12 20,-6"/>
    <path d="M 20,-6 C 22,0 16,2 14,-2 C 12,-6 16,-8 20,-6 Z" fill="#0A0A0A" fill-opacity="0.6"/>
  </g>

  <!-- Centre bottom flourish (below lower lines) -->
  <g transform="translate(280, 315)" fill="none" stroke="#0A0A0A" stroke-width="0.9">
    <!-- Central downward ornament -->
    <path d="M -22,0 C -10,6 10,6 22,0"/>
    <path d="M 0,0 C -10,10 -24,14 -28,24 C -20,18 -8,16 0,20 C 8,16 20,18 28,24 C 24,14 10,10 0,0 Z"
          fill="#0A0A0A" fill-opacity="0.65" stroke="none"/>
    <!-- Side petals -->
    <path d="M -36,10 C -44,16 -44,28 -36,30 C -28,30 -26,20 -32,16 C -28,14 -24,20 -28,24"/>
    <path d="M  36,10 C  44,16  44,28  36,30 C  28,30  26,20  32,16 C  28,14  24,20  28,24"/>
    <!-- Bottom dot -->
    <circle cx="0" cy="36" r="3" fill="#0A0A0A"/>
    <line x1="-6" y1="36" x2="6" y2="36" stroke="#0A0A0A" stroke-width="0.7"/>
  </g>

  <!-- Left side tall scroll (fills gap between upper/lower clusters) -->
  <g transform="translate(76, 230)" fill="none" stroke="#0A0A0A" stroke-width="0.85">
    <path d="M 0,-30 C -8,-20 -8,20 0,30"/>
    <path d="M 0,-20 C -14,-16 -14,16 0,20"/>
    <!-- Leaf accents -->
    <path d="M -6,-8 C -12,-12 -12,-4 -6,-4 Z" fill="#0A0A0A" fill-opacity="0.55"/>
    <path d="M -6,8  C -12,12  -12,4  -6,4  Z" fill="#0A0A0A" fill-opacity="0.55"/>
    <!-- Dot centre -->
    <circle cx="-10" cy="0" r="2" fill="#0A0A0A"/>
  </g>

  <!-- Right side tall scroll (mirror) -->
  <g transform="translate(484, 230) scale(-1,1)" fill="none" stroke="#0A0A0A" stroke-width="0.85">
    <path d="M 0,-30 C -8,-20 -8,20 0,30"/>
    <path d="M 0,-20 C -14,-16 -14,16 0,20"/>
    <path d="M -6,-8 C -12,-12 -12,-4 -6,-4 Z" fill="#0A0A0A" fill-opacity="0.55"/>
    <path d="M -6,8  C -12,12  -12,4  -6,4  Z" fill="#0A0A0A" fill-opacity="0.55"/>
    <circle cx="-10" cy="0" r="2" fill="#0A0A0A"/>
  </g>

  <!-- Small corner dots (4 corners of inner oval region) -->
  <circle cx="96" cy="168" r="2.2" fill="#0A0A0A"/>
  <circle cx="464" cy="168" r="2.2" fill="#0A0A0A"/>
  <circle cx="96" cy="296" r="2.2" fill="#0A0A0A"/>
  <circle cx="464" cy="296" r="2.2" fill="#0A0A0A"/>
</svg>
